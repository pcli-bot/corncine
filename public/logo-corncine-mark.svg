    <rect x="51" y="22" width="5" height="3.5" rx="1"/>
    <rect x="51" y="30" width="5" height="3.5" rx="1"/>
    <rect x="51" y="38" width="5" height="3.5" rx="1"/>
    <rect x="51" y="46" width="5" height="3.5" rx="1"/>
